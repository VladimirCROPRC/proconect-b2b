<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#465894" />
    <title>Proconect B2B — Fără conexiune</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eef2fa; color: #152251; font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100%, 420px); padding: 36px; border: 1px solid #d9e0ef; border-radius: 22px; background: #fff; box-shadow: 0 24px 60px rgba(24, 39, 86, .14); }
      img { width: 72px; height: 72px; border-radius: 18px; }
      p { color: #687392; line-height: 1.55; }
      button { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 8px; background: #465894; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192.png" alt="" />
      <h1>Nu există conexiune la internet</h1>
      <p>Proconect B2B are nevoie de conexiune pentru autentificare, proiecte și sincronizarea documentației. Datele securizate nu sunt păstrate în memoria offline.</p>
      <button type="button" onclick="location.reload()">Încearcă din nou</button>
    </main>
  </body>
</html>
