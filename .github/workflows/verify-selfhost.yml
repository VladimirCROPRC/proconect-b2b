name: Verify Ubuntu copy
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Access, SQLite, file storage and copy isolation tests
        run: node --test tests/selfhost.test.mjs
      - name: Standalone Node build
        run: npm run build:selfhost
      - name: Real HTTP smoke test
        run: node tests/selfhost-smoke.mjs
